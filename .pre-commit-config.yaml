# Pre-commit hooks. Install once with `pre-commit install`, then they run on every commit.
#
# WHAT THIS IS AND IS NOT. These are the same checks CI runs, moved earlier so a mistake
# costs seconds instead of a round-trip. They are NOT a substitute for CI: a hook only sees
# what you commit on the machine that has it installed, and `--no-verify` exists. CI is the
# gate; this is the courtesy.
#
# Every hook here runs offline and needs no cloud credential, for the same reason CI does:
# a reference architecture whose checks require secrets is one nobody who forks it can run.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # docs/variant-delta.md is GENERATED by tools/gen-variant-delta.sh and is a unified
        # diff. Diff context lines legitimately carry trailing whitespace — it is the
        # whitespace of the file being diffed. Stripping it here would make the file differ
        # from what the generator produces, and the drift-guard job in CI would then fail
        # on a file nobody edited. Fix the generator if this ever needs to change.
        exclude: ^docs/variant-delta\.md$
      - id: check-merge-conflict
      - id: check-yaml
        # The workflow files use GitHub's `on:` key, which check-yaml reads as the YAML 1.1
        # boolean True. That is a quirk of the parser rather than a defect in the file.
        exclude: ^\.github/workflows/

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      # Scoped per variant by the hook itself. Note this is `fmt`, which REWRITES; CI runs
      # `fmt -check`, which only reports. The pair is deliberate: fix locally, verify in CI.
      - id: terraform_fmt

      # `validate` needs an initialised working directory, so this hook runs
      # `terraform init -backend=false` for you. It reaches the provider registry — the
      # only hook here that touches the network — and it is worth it: validate is what
      # catches a reference to a variable that no longer exists.
      - id: terraform_validate
        args: ['--tf-init-args=-backend=false']

      - id: terraform_tflint

  # Last, and deliberately so: if an earlier hook rewrites a file, this one scans what the
  # rewrite produced rather than what you typed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # Reads .gitleaks.toml from the repository root. Read that file before adding to
        # its allowlist — every entry there is a place a real finding could hide.
        args: ['--config', '.gitleaks.toml']
