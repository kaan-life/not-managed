name: CI

# EVERY JOB HERE RUNS WITHOUT CLOUD CREDENTIALS. That is a hard requirement, not a
# preference: a reference architecture whose CI needs secrets is one a forker cannot run,
# and a green build that only the maintainer can reproduce is not a check on anything.
# Hence `-backend=false` everywhere, and no `secrets:` in this file at all.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform (${{ matrix.variant }}, tf ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # fail-fast: false on purpose. The variants are independent copies (ADR-0007), so
      # "solo failed" tells you nothing about ha — and cancelling ha's job is exactly how
      # a divergence stays hidden for another pull request.
      matrix:
        variant: [solo, ha]
        # THE TWO ENTRIES ARE THE BOUNDS OF required_version, AND THAT COUPLING IS THE
        # POINT. variants/*/providers.tf declares `required_version = "~> 1.12"`: the low
        # entry here is that lower bound, the high entry is the version the configuration
        # is developed against. Raise the constraint and this list has to move with it.
        #
        # THE FLOOR IS NOT CEREMONIAL, and this repository has the receipt. The constraint
        # used to say "~> 1.10" and had never been run at 1.10 by anyone. The first CI run
        # that tried it failed — inside UPSTREAM kube-hetzner 2.19.2, on a validation
        # condition where `||` does not short-circuit before 1.12, so `contains()` is
        # handed a null. Bisected here across the latest patch of every minor from 1.10 to
        # 1.15, on both variants: 1.10.5 and 1.11.4 fail, 1.12.2 upward passes.
        #
        # 1.12.0 rather than the 1.12.2 that was bisected, deliberately. "~> 1.12" asserts
        # that 1.12.0 works; inferring that from 1.12.2 would re-create the exact hole this
        # job just found, one minor further up.
        terraform: ['1.12.0', '1.15.6']
    defaults:
      run:
        working-directory: variants/${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      # Scoped to *.tf rather than -recursive. `fmt -check -recursive` also reads
      # .tfvars files, and a forker's real secrets.auto.tfvars is not this repository's
      # formatting problem — it made the check fail permanently for local reasons.
      - name: terraform fmt -check
        run: terraform fmt -check *.tf

      - name: terraform init -backend=false
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      # Runs offline. Every case in firewall_validations.tftest.hcl is an expect_failures
      # run against a variable validation, and all five declared providers are replaced by
      # mock_provider — so this needs no Hetzner, GitHub or Kubernetes credential, which is
      # the same hard requirement every other job here meets.
      #
      # `fmt -check` above is scoped to *.tf and therefore does not cover this file, so
      # format it explicitly rather than leaving one file in the tree unchecked.
      - name: terraform fmt -check (tests)
        run: terraform fmt -check *.tftest.hcl

      - name: terraform test
        run: terraform test

  variant-delta:
    name: variant delta is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The only thing standing between two hand-maintained copies and silent divergence.
      # It fails when someone changed one variant and did not regenerate the delta.
      - run: ./tools/gen-variant-delta.sh --check

  vendored-manifest:
    name: vendored local-path manifest (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [solo, ha]
    steps:
      - uses: actions/checkout@v7

      # This repository vendors k3s' local-storage manifest, so it — not k3s — is now
      # responsible for keeping it current. The check regenerates from upstream and diffs.
      #
      # THE VERSION COMES OUT OF THE FILE'S OWN HEADER, and that is the whole design of
      # this step. CI has no kubeconfig and cannot ask a cluster what it runs. Hardcoding
      # the version here would create a second copy that drifts from the file it checks —
      # and the job would then pass, cheerfully, against the wrong version. The generator
      # writes the version into line 2 precisely so this is a one-line read.
      - name: Read the pinned k3s version out of the generated file
        id: pin
        run: |
          set -euo pipefail
          tpl="variants/${{ matrix.variant }}/extra-manifests/local-path-provisioner.yaml.tpl"
          version=$(sed -n 's|^#  *\./scripts/vendor-local-path\.sh \(v[^ ]*\).*|\1|p' "$tpl" | head -1)
          # An empty version would make the script exit 2 with a usage message, which is a
          # failure — but fail here instead, with a message that names the real cause.
          if [ -z "$version" ]; then
            echo "::error file=$tpl::could not read the k3s version from the header." \
                 "Line 2 must stay in the form '#     ./scripts/vendor-local-path.sh vX.Y.Z+k3sN'," \
                 "because this job and nothing else depends on it." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pinned k3s version: $version"

      - name: Check the vendored manifest against upstream
        run: ./variants/${{ matrix.variant }}/scripts/vendor-local-path.sh "${{ steps.pin.outputs.version }}" --check

  module-pin:
    name: kube-hetzner 3.1.0 still resolves to the same commit
    runs-on: ubuntu-latest
    steps:
      # A Terraform registry version is a mutable label pointing at an immutable commit.
      # The registry resolves `version = "3.1.0"` to a git ref at publication time and
      # serves it in the x-terraform-get header, so the pin is as strong as that mapping
      # and no stronger. If the owner ever republishes 3.1.0 against a different commit,
      # every `terraform init` in the world starts fetching different code under the same
      # version string — and nothing in the lockfile would notice, because module sources
      # are not lockfile-tracked. This job is the notice.
      #
      # (This replaced a proposal to pin a git source directly, which was measured to buy
      # no extra immutability and cost a full clone per init. See the plan's mutation log.)
      - name: Resolve the pinned version and compare the commit
        run: |
          set -euo pipefail
          # KEEP IN SYNC with the `version =` in variants/*/main.tf. Until 2026-08-12 this
          # job checked 2.19.2 while both variants had already moved to 3.1.0 — green,
          # and guarding nothing. A guard pinned to a version the repository no longer
          # uses is worse than no guard: it reports that the thing it is not watching
          # is fine.
          expected=ed524efe85377a62f1aecf34422c8ab1b073a75b
          url=https://registry.terraform.io/v1/modules/kube-hetzner/kube-hetzner/hcloud/3.1.0/download
          header=$(curl -fsS -D - -o /dev/null "$url" | tr -d '\r' | grep -i '^x-terraform-get:' || true)
          if [ -z "$header" ]; then
            echo "::error::the registry returned no x-terraform-get header for $url" >&2
            exit 1
          fi
          echo "$header"
          actual="${header##*ref=}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::kube-hetzner 3.1.0 now resolves to $actual, expected $expected." \
                 "The same version string is serving different code. Do not upgrade past this" \
                 "job — investigate what changed upstream first." >&2
            exit 1
          fi
          echo "3.1.0 -> $actual (unchanged)"

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    # Only pull requests have a range of commits to check. A push to main has already
    # been through this on its pull request.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ADR-0006 chose the DCO over a CLA, and said CI would enforce it. Enforcement is
      # here rather than in a bot so that it is readable, has no third-party access to
      # this repository, and fails with instructions instead of a link.
      - name: Every commit carries Signed-off-by
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "  no sign-off: $(git log -1 --format='%h %s' "$sha")"
              missing=$((missing+1))
            fi
          done < <(git rev-list --no-merges "$base..$head")
          if [ "$missing" -gt 0 ]; then
            echo
            echo "::error::$missing commit(s) are missing a Signed-off-by line."
            echo "Fix the last commit:      git commit --amend -s"
            echo "Fix the whole branch:     git rebase --signoff ${base}"
            echo "Then:                     git push --force-with-lease"
            exit 1
          fi
          echo "all commits signed off"
