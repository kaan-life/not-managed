name: CI

# EVERY JOB HERE RUNS WITHOUT CLOUD CREDENTIALS. That is a hard requirement, not a
# preference: a reference architecture whose CI needs secrets is one a forker cannot run,
# and a green build that only the maintainer can reproduce is not a check on anything.
# Hence `-backend=false` everywhere, and no `secrets:` in this file at all.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, because module-pin and vendored-manifest guard UPSTREAM drift: the registry
  # re-mapping a version string or k3s moving the local-path manifest happens on
  # upstream's clock, not this repository's. Guards that only fire on commits go quiet
  # exactly when the repository does — and a quiet repository is this one's steady state.
  #
  # GITHUB DISABLES THIS TRIGGER ON INACTIVITY, and that can hit this repository:
  # docs.github.com ("Disabling and enabling a workflow", read 2026-08-16) says scheduled
  # workflows in public repositories are disabled automatically after 60 days without
  # repository activity. Re-enable with: gh workflow enable CI  (or the "Enable workflow"
  # button under Actions). A silently-disabled schedule is the same failure class this
  # trigger exists to close, so check it after any long quiet stretch.
  schedule:
    - cron: '43 5 * * 1'

permissions:
  contents: read

concurrency:
  # github.event_name is part of the key so the weekly scheduled run and a push run on
  # main can never cancel each other: both would otherwise share "CI-refs/heads/main",
  # and cancel-in-progress would let the cron kill a real push's guard run (or vice
  # versa). Within one event type the old behaviour is unchanged.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform (${{ matrix.variant }}, tf ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # fail-fast: false on purpose. The variants are independent copies (ADR-0007), so
      # "solo failed" tells you nothing about ha — and cancelling ha's job is exactly how
      # a divergence stays hidden for another pull request.
      matrix:
        variant: [solo, ha]
        # THE TWO ENTRIES ARE THE BOUNDS OF required_version, AND THAT COUPLING IS THE
        # POINT. variants/*/providers.tf declares `required_version = "~> 1.12"`: the low
        # entry here is that lower bound, the high entry is the version the configuration
        # is developed against. Raise the constraint and this list has to move with it.
        #
        # THE FLOOR IS NOT CEREMONIAL, and this repository has the receipt. The constraint
        # used to say "~> 1.10" and had never been run at 1.10 by anyone. The first CI run
        # that tried it failed — inside UPSTREAM kube-hetzner 2.19.2, on a validation
        # condition where `||` does not short-circuit before 1.12, so `contains()` is
        # handed a null. Bisected here across the latest patch of every minor from 1.10 to
        # 1.15, on both variants: 1.10.5 and 1.11.4 fail, 1.12.2 upward passes.
        #
        # 1.12.0 rather than the 1.12.2 that was bisected, deliberately. "~> 1.12" asserts
        # that 1.12.0 works; inferring that from 1.12.2 would re-create the exact hole this
        # job just found, one minor further up.
        #
        # The coupling is no longer only prose: the matrix-floor job below fails the build
        # when this list's lowest entry stops being required_version's lower bound.
        #
        # Branch protection needs nothing when these versions move, and that is by design.
        # These job names carry the version, so protection used to demand check names this
        # list could rename out from under it; it now requires only the aggregating `gate`
        # job, whose name never changes.
        terraform: ['1.12.0', '1.15.6']
    defaults:
      run:
        working-directory: variants/${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      # Scoped to *.tf rather than -recursive. `fmt -check -recursive` also reads
      # .tfvars files, and a forker's real secrets.auto.tfvars is not this repository's
      # formatting problem — it made the check fail permanently for local reasons.
      - name: terraform fmt -check
        run: terraform fmt -check *.tf

      - name: terraform init -backend=false
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      # Runs offline. Every case in firewall_validations.tftest.hcl is an expect_failures
      # run against a variable validation, and all five declared providers are replaced by
      # mock_provider — so this needs no Hetzner, GitHub or Kubernetes credential, which is
      # the same hard requirement every other job here meets.
      #
      # `fmt -check` above is scoped to *.tf and therefore does not cover this file, so
      # format it explicitly rather than leaving one file in the tree unchecked.
      - name: terraform fmt -check (tests)
        run: terraform fmt -check *.tftest.hcl

      - name: terraform test
        run: terraform test

  matrix-floor:
    name: terraform matrix floor equals required_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The terraform matrix's comment promises that its lowest entry IS required_version's
      # lower bound. Until now that coupling was maintained by hand, and module-pin's
      # comment records how that ends: this repository once shipped a guard pinned to a
      # version nothing used any more — green, and guarding nothing. This job turns the
      # promise into a check: it reads both sides from the files themselves (never a copy
      # of either value, for the same reason vendored-manifest reads the k3s version out
      # of the file it checks) and fails when they disagree.
      - name: The lowest matrix entry is the required_version lower bound
        run: |
          set -euo pipefail

          constraints=$(grep -hE '^[[:space:]]*required_version[[:space:]]*=' \
              variants/solo/providers.tf variants/ha/providers.tf \
            | tr -d ' "' | cut -d= -f2 | sort -u)
          if [ "$(wc -l <<<"$constraints")" -ne 1 ]; then
            echo "::error::the variants disagree on required_version: $(tr '\n' ' ' <<<"$constraints")." \
                 "ADR-0007 keeps them as independent copies, but the Terraform floor is one" \
                 "contract — reconcile providers.tf before touching the matrix." >&2
            exit 1
          fi

          # Only the "~> X.Y" / "~> X.Y.Z" form is parsed, because that is the form the
          # repository uses. Any other operator fails loudly rather than being guessed at:
          # a guard that misparses its subject is the module-pin lesson all over again.
          case "$constraints" in
            "~>"*) base="${constraints#~>}" ;;
            *)
              echo "::error::required_version is '$constraints', which this guard cannot parse." \
                   "Update this step's parser in the same commit that changes the constraint form." >&2
              exit 1
              ;;
          esac
          IFS=. read -r major minor patch <<<"$base"
          expected="${major}.${minor}.${patch:-0}"

          entries=$(sed -n "s/^ *terraform: \[\(.*\)\]/\1/p" .github/workflows/ci.yml \
            | tr -d " '" | tr ',' '\n')
          if [ -z "$entries" ]; then
            echo "::error::could not parse the terraform matrix out of ci.yml — if the" \
                 "matrix moved or changed shape, move this parser with it." >&2
            exit 1
          fi
          lowest=$(sort -V <<<"$entries" | head -1)

          if [ "$lowest" != "$expected" ]; then
            echo "::error::the terraform matrix floor is $lowest but required_version" \
                 "\"~>${base}\" asserts ${expected} works. The lowest matrix entry must BE" \
                 "the lower bound — raise the constraint and the matrix together" \
                 "(and the branch-protection required-checks list, which carries the old" \
                 "version in its check names)." >&2
            exit 1
          fi
          echo "matrix floor $lowest == required_version lower bound $expected"

  tflint:
    name: tflint (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Same reasoning as the terraform job: the variants are independent copies
      # (ADR-0007), so one variant's lint result says nothing about the other's.
      matrix:
        variant: [solo, ha]
    defaults:
      run:
        working-directory: variants/${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7

      # tflint_version is EXACT rather than "latest", for the usual reason: a linter that
      # updates itself decides on its own schedule when this build goes red. Dependabot
      # bumps the action's major; the tflint binary version below moves by hand, in a
      # commit whose diff shows any new findings next to the bump that caused them.
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      # No .tflint.hcl in this repository, measured before adding this job: tflint's
      # bundled terraform ruleset ("recommended" preset) is on by default and needs no
      # configuration file, no `tflint --init`, and no network or credentials. A config
      # file only earns its place here the day a rule needs adjusting — and then per
      # finding, in the diff, not as a blanket disable.
      - name: tflint
        run: tflint --format compact

  checkov:
    name: checkov (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [solo, ha]
    steps:
      - uses: actions/checkout@v7

      # pipx, because ubuntu-latest's system Python is externally managed (PEP 668) and
      # this needs no setup-python action just to install one CLI. The version is EXACT
      # for the same reason tflint's is: a policy scanner that updates itself decides on
      # its own schedule when this build goes red. Bump it by hand, in a commit whose
      # diff shows any new findings next to the bump.
      - name: Install checkov
        run: pipx install checkov==3.3.11

      # --framework terraform scopes the scan to the .tf files: the packer templates and
      # the vendored kubernetes manifests under extra-manifests/ have their own guards,
      # and checkov's terraform config scan is the piece the plan's §M5 asked for. Like
      # every other job here, this runs without credentials — checkov reads files, not
      # clouds. Findings are handled per finding: fixed, or suppressed inline with
      # `#checkov:skip=<rule>: <reason>` where the reason is visible in the diff — never
      # disabled wholesale.
      - name: checkov (terraform config scan)
        run: checkov --directory "variants/${{ matrix.variant }}" --framework terraform --quiet

  variant-delta:
    name: variant delta is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The only thing standing between two hand-maintained copies and silent divergence.
      # It fails when someone changed one variant and did not regenerate the delta.
      - run: ./tools/gen-variant-delta.sh --check

  vendored-manifest:
    name: vendored local-path manifest (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [solo, ha]
    steps:
      - uses: actions/checkout@v7

      # This repository vendors k3s' local-storage manifest, so it — not k3s — is now
      # responsible for keeping it current. The check regenerates from upstream and diffs.
      #
      # THE VERSION COMES OUT OF THE FILE'S OWN HEADER, and that is the whole design of
      # this step. CI has no kubeconfig and cannot ask a cluster what it runs. Hardcoding
      # the version here would create a second copy that drifts from the file it checks —
      # and the job would then pass, cheerfully, against the wrong version. The generator
      # writes the version into line 2 precisely so this is a one-line read.
      - name: Read the pinned k3s version out of the generated file
        id: pin
        run: |
          set -euo pipefail
          tpl="variants/${{ matrix.variant }}/extra-manifests/local-path-provisioner.yaml.tpl"
          version=$(sed -n 's|^#  *\./scripts/vendor-local-path\.sh \(v[^ ]*\).*|\1|p' "$tpl" | head -1)
          # An empty version would make the script exit 2 with a usage message, which is a
          # failure — but fail here instead, with a message that names the real cause.
          if [ -z "$version" ]; then
            echo "::error file=$tpl::could not read the k3s version from the header." \
                 "Line 2 must stay in the form '#     ./scripts/vendor-local-path.sh vX.Y.Z+k3sN'," \
                 "because this job and nothing else depends on it." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pinned k3s version: $version"

      - name: Check the vendored manifest against upstream
        run: ./variants/${{ matrix.variant }}/scripts/vendor-local-path.sh "${{ steps.pin.outputs.version }}" --check

  module-pin:
    name: kube-hetzner 3.1.0 still resolves to the same commit
    runs-on: ubuntu-latest
    steps:
      # A Terraform registry version is a mutable label pointing at an immutable commit.
      # The registry resolves `version = "3.1.0"` to a git ref at publication time and
      # serves it in the x-terraform-get header, so the pin is as strong as that mapping
      # and no stronger. If the owner ever republishes 3.1.0 against a different commit,
      # every `terraform init` in the world starts fetching different code under the same
      # version string — and nothing in the lockfile would notice, because module sources
      # are not lockfile-tracked. This job is the notice.
      #
      # (This replaced a proposal to pin a git source directly, which was measured to buy
      # no extra immutability and cost a full clone per init. See the plan's mutation log.)
      - name: Resolve the pinned version and compare the commit
        run: |
          set -euo pipefail
          # KEEP IN SYNC with the `version =` in variants/*/main.tf. Until 2026-08-12 this
          # job checked 2.19.2 while both variants had already moved to 3.1.0 — green,
          # and guarding nothing. A guard pinned to a version the repository no longer
          # uses is worse than no guard: it reports that the thing it is not watching
          # is fine.
          expected=ed524efe85377a62f1aecf34422c8ab1b073a75b
          url=https://registry.terraform.io/v1/modules/kube-hetzner/kube-hetzner/hcloud/3.1.0/download
          header=$(curl -fsS -D - -o /dev/null "$url" | tr -d '\r' | grep -i '^x-terraform-get:' || true)
          if [ -z "$header" ]; then
            echo "::error::the registry returned no x-terraform-get header for $url" >&2
            exit 1
          fi
          echo "$header"
          actual="${header##*ref=}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::kube-hetzner 3.1.0 now resolves to $actual, expected $expected." \
                 "The same version string is serving different code. Do not upgrade past this" \
                 "job — investigate what changed upstream first." >&2
            exit 1
          fi
          echo "3.1.0 -> $actual (unchanged)"

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    # Only pull requests have a range of commits to check. A push to main has already
    # been through this on its pull request.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ADR-0006 chose the DCO over a CLA, and said CI would enforce it. Enforcement is
      # here rather than in a bot so that it is readable, has no third-party access to
      # this repository, and fails with instructions instead of a link.
      - name: Every commit carries Signed-off-by
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "  no sign-off: $(git log -1 --format='%h %s' "$sha")"
              missing=$((missing+1))
            fi
          done < <(git rev-list --no-merges "$base..$head")
          if [ "$missing" -gt 0 ]; then
            echo
            echo "::error::$missing commit(s) are missing a Signed-off-by line."
            echo "Fix the last commit:      git commit --amend -s"
            echo "Fix the whole branch:     git rebase --signoff ${base}"
            echo "Then:                     git push --force-with-lease"
            exit 1
          fi
          echo "all commits signed off"

  gate:
    # THIS JOB'S NAME IS THE BRANCH-PROTECTION CONTRACT. `main` requires exactly one
    # status check, and it is this one. Every other job reaches the protection rule
    # through this job's `needs:` list, which is why that list has a guard of its own
    # below.
    #
    # WHY ONE AGGREGATED CHECK RATHER THAN FOURTEEN NAMED ONES. Half of the check names
    # carry a Terraform version ("terraform (solo, tf 1.12.0)"), so bumping the matrix
    # renamed the very checks the protection rule demanded — and a protection rule that
    # names a check nobody reports does not fail loudly: GitHub parks the pull request on
    # "Expected — waiting for status" indefinitely. The same trap sprang on a renamed or
    # deleted job. Depending on one stable name removes the coupling instead of
    # automating it; automating it was never an option anyway, since `administration` is
    # not among the permissions a GITHUB_TOKEN can hold, so keeping the list in sync from
    # CI would have meant an admin-scoped secret in a public repository — exactly what
    # the header of this file forbids.
    #
    # Rename this job and every merge blocks until the protection rule is renamed with
    # it. That is loud, and deliberately so.
    name: all checks passed
    runs-on: ubuntu-latest
    needs:
      - terraform
      - matrix-floor
      - tflint
      - checkov
      - variant-delta
      - vendored-manifest
      - module-pin
      - dco
    # ALWAYS, AND THAT IS THE WHOLE POINT. Without it, a failed dependency would leave
    # this job "skipped", the required check would never report at all, and the pull
    # request would hang on "Expected — waiting for status" instead of showing a red X —
    # the same silent-block failure this job exists to remove.
    if: always()
    steps:
      - uses: actions/checkout@v7

      # The structural half, checked before the results half: an aggregated gate is only
      # as complete as its `needs:` list, and a job missing from that list cannot block a
      # merge no matter how red it is. That is the stale-guard class module-pin's comment
      # records, so it gets the same treatment: read both sides out of this file and fail
      # when they disagree, rather than trusting anyone to remember.
      - name: The needs list covers every job in this workflow
        run: |
          set -euo pipefail

          jobs=$(sed -n '/^jobs:/,$p' .github/workflows/ci.yml \
            | grep -oE '^  [a-z][a-z0-9_-]*:' | tr -d ' :' | grep -vx gate | sort -u)

          # Scoped to this job's own block rather than grepping the file for `needs:`, so
          # that another job gaining a needs list of its own does not confuse the parse.
          declared=$(awk '
            /^  gate:/            { in_gate = 1; next }
            in_gate && /^  [a-z]/ { in_gate = 0 }
            in_gate && /^    needs:/ { in_needs = 1; next }
            in_needs && /^      - / { sub(/^      - /, ""); print; next }
            in_needs                { in_needs = 0 }
          ' .github/workflows/ci.yml | sort -u)

          if [ -z "$declared" ]; then
            echo "::error::could not read this job's needs list out of ci.yml. If the job" \
                 "was renamed or its needs list changed shape, move this parser with it —" \
                 "a guard that cannot parse its subject must fail, not pass." >&2
            exit 1
          fi

          missing=$(comm -23 <(echo "$jobs") <(echo "$declared") | tr '\n' ' ')
          stale=$(comm -13 <(echo "$jobs") <(echo "$declared") | tr '\n' ' ')

          if [ -n "${missing// /}" ]; then
            echo "::error::these jobs are not in this gate's needs list: ${missing}" \
                 "Branch protection requires only this check, so a job the gate does not" \
                 "depend on cannot block a merge — add it to needs: above." >&2
            exit 1
          fi
          if [ -n "${stale// /}" ]; then
            echo "::error::this gate's needs list names jobs that no longer exist:" \
                 "${stale} Remove them: a dependency on a deleted job is a dependency on" \
                 "nothing." >&2
            exit 1
          fi
          echo "needs list covers all $(wc -w <<<"$jobs") jobs"

      # The results half. `needs` arrives as JSON through the environment rather than
      # being interpolated into the script, which is the same rule the rest of this file
      # follows for anything that is not a literal.
      - name: Every job this gate depends on succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Printed unconditionally, because this check is the one the merge box names:
          # its log has to be enough to see WHICH job failed, without opening another.
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$NEEDS_JSON"

          bad=$(jq -r 'to_entries[]
                       | select(.value.result == "failure" or .value.result == "cancelled")
                       | .key' <<<"$NEEDS_JSON" | tr '\n' ' ')
          if [ -n "${bad// /}" ]; then
            echo "::error::these jobs did not succeed: ${bad}" >&2
            exit 1
          fi

          # A skip is legitimate on push and schedule — dco only has commits to check on
          # a pull request. On a pull request nothing may be skipped: that is where this
          # check gates a merge, and a job that does not run is a job that does not
          # guard. An `if:` that silently switches a job off would otherwise pass here.
          skipped=$(jq -r 'to_entries[]
                           | select(.value.result == "skipped")
                           | .key' <<<"$NEEDS_JSON" | tr '\n' ' ')
          if [ -n "${skipped// /}" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::error::these jobs were skipped on a pull request: ${skipped}" \
                 "Nothing may be skipped where this check gates a merge — a job that does" \
                 "not run is a job that does not guard." >&2
            exit 1
          fi
          echo "all dependencies succeeded"
